# Local single-service stack. No deploy to a remote host.
# Published port stays on the workstation loopback (SAD AD-08).

services:
  recruitment-assistant:
    build:
      context: .
      dockerfile: Dockerfile
    image: recruitment-assistant:0.1.0
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      AAMAD_TARGET_RUNTIME: crewai
      CREWAI_TELEMETRY_OPT_OUT: "true"
      APP_ENV: production
      PORT: "8000"
    volumes:
      - ./var/runs:/app/var/runs
    restart: "no"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
