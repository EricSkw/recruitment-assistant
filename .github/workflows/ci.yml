# Lint, test, and build only. No deploy job (SAD §5, PRD infrastructure).

name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend pins
        run: pip install -r requirements.txt
      - name: Syntax check
        run: python -m compileall -q src/backend deploy
      - name: Unit and integration tests
        working-directory: src/backend
        run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - name: Install, test, lint, and build
        working-directory: src/frontend
        run: |
          npm ci
          npm test
          npm run lint
          npm run build
